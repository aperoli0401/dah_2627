<ion-card *ngIf="libro" [class.borde-destacado]="libro.destacado">
  <ion-item>
    <ion-checkbox 
      slot="start" 
      [checked]="libro.completado"
      (ionChange)="libro.completado = $event.detail.checked">
    </ion-checkbox>
    
    <ion-label [class.tachado]="libro.completado">
      {{ libro.titulo | uppercase }}
    </ion-label>

    <ion-select 
      slot="end" 
      interface="popover" 
      [value]="libro.destacado" 
      (ionChange)="libro.destacado = $event.detail.value">
      <ion-select-option [value]="false">Normal</ion-select-option>
      <ion-select-option [value]="true">Favorito</ion-select-option>
    </ion-select>

    <ion-button (click)="mostrarDetalles()" slot="end">
      Ver
    </ion-button>
  </ion-item>
</ion-card>
