<ion-card>
  <ion-item>
    <ion-checkbox
      slot="start"
      [checked]="libros.completada">
    </ion-checkbox>

    <ion-label [class.tachado]="libros.completada">
      {{ libros.titulo }}
    </ion-label>

    <ion-button (click)="mostrarDetalles()" slot="end">
      Ver
    </ion-button>
  </ion-item>
</ion-card>
