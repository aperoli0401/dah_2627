<ion-card>
  <ion-item>
    <ion-checkbox
      slot="start"
      [checked]="libro.completado">
    </ion-checkbox>

    <ion-label [class.tachado]="libro.completado">
      {{ libro.titulo }}
    </ion-label>

    <ion-button (click)="mostrarDetalles()" slot="end">
      Ver
    </ion-button>
  </ion-item>
</ion-card>
