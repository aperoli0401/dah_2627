<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Mis Libros</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Bucle *ngFor para recorrer tu array y renderizar el componente -->
  <app-task-item 
    *ngFor="let libro of listaDeLibros" 
    [libros]="libro">
  </app-task-item>
</ion-content>
