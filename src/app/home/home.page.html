<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Biblioteca</ion-title>
    <!-- Contenedor de botones situado fuera de ion-title con slot="end" -->
    <ion-buttons slot="end">
      <ion-button routerLink="/ajustes">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar color="primary">
      <ion-title size="large">Biblioteca</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Mensaje si la lista está vacía con alineación de texto centralizada -->
  <div *ngIf="listaDeLibros.length === 0" class="mensaje-vacio ion-text-center">
    <p>¡Enhorabuena!</p>
    <p>No hay libros pendientes en la biblioteca.</p>
  </div>


  <!-- Rejilla de Ionic con utilidades Flexbox -->
  <ion-grid>
    <ion-row class="ion-align-items-center ion-justify-content-center">
      <ion-col size="12" size-md="6" size-lg="4"
        *ngFor="let libro of listaDeLibros">
        <app-task-item [libro]="libro"></app-task-item>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
